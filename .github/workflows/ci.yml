name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        # Pinned: other versions format some constructs differently.
        run: pipx install clang-format==21.1.8
      - name: Check formatting
        run: git ls-files -z '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror

  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cxx: g++-14
            qt: 6.8.3
            qt-modules: qtmultimedia
            sanitize: OFF
          - name: Clang
            cxx: clang++-18
            qt: 6.8.3
            qt-modules: qtmultimedia
            sanitize: OFF
          - name: ASan + UBSan
            cxx: g++-14
            qt: 6.8.3
            qt-modules: ""
            sanitize: ON
          # The oldest Qt that CMakeLists.txt accepts, without the optional
          # Qt Multimedia.
          - name: Qt 6.5
            cxx: g++-13
            qt: 6.5.3
            qt-modules: ""
            sanitize: OFF
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build catch2 libgl1-mesa-dev libxkbcommon-dev
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: ${{ matrix.qt-modules }}
          cache: true
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DVCUBE_WARNINGS_AS_ERRORS=ON
          -DVCUBE_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows MSVC
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Configure
        shell: cmd
        run: |
          set QTDIR=%QT_ROOT_DIR%
          cmake --preset windows-release -DVCUBE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset windows-release
      - name: Test
        run: ctest --preset windows-release
      - name: Package
        working-directory: build/windows-release
        run: cpack
      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: v-cube-windows-x64
          path: build/windows-release/v-cube-*.zip
          if-no-files-found: error
