name: CI

# A push or pull request runs only the format check and the GCC build, to
# save Actions minutes. The other compilers, the oldest Qt, the sanitizers
# and Windows run on a manual run (workflow_dispatch) and weekly, when main
# has changed that week. Release tags build Windows too (release.yml).
# Docs-only changes skip CI, except docs/keys.md, which the GUI test checks
# against the key table (the last matching pattern wins).
on:
  push:
    branches: [main]
    paths: ["**", "!docs/**", "!**.md", "!LICENSE", "docs/keys.md"]
  pull_request:
    paths: ["**", "!docs/**", "!**.md", "!LICENSE", "docs/keys.md"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  # On the weekly run: whether main has a commit from the last seven days.
  recent:
    name: Changed this week
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          echo "changed=$([ "$age" -lt 604800 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  format:
    if: github.event_name != 'schedule'
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install clang-format
        # Pinned: other versions format some constructs differently.
        run: pipx install clang-format==21.1.8
      - name: Check formatting
        run: git ls-files -z '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror

  linux:
    name: Linux GCC
    needs: recent
    if: >-
      !cancelled() &&
      (github.event_name != 'schedule' || needs.recent.outputs.changed == 'true')
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - cxx: g++-14
            qt: 6.8.3
            qt-modules: qtmultimedia
            sanitize: OFF
    steps: &linux-steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build catch2 libgl1-mesa-dev libxkbcommon-dev
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: ${{ matrix.qt-modules }}
          cache: true
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DVCUBE_WARNINGS_AS_ERRORS=ON
          -DVCUBE_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Only on a manual run, or weekly when main has changed.
  linux-full:
    name: Linux ${{ matrix.name }}
    needs: recent
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && needs.recent.outputs.changed == 'true'))
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang
            cxx: clang++-18
            qt: 6.8.3
            qt-modules: qtmultimedia
            sanitize: OFF
          - name: ASan + UBSan
            cxx: g++-14
            qt: 6.8.3
            qt-modules: ""
            sanitize: ON
          # The oldest Qt that CMakeLists.txt accepts, without the optional
          # Qt Multimedia.
          - name: Qt 6.5
            cxx: g++-13
            qt: 6.5.3
            qt-modules: ""
            sanitize: OFF
    steps: *linux-steps

  windows:
    name: Windows MSVC
    needs: recent
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && needs.recent.outputs.changed == 'true'))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Configure
        shell: cmd
        run: |
          set QTDIR=%QT_ROOT_DIR%
          cmake --preset windows-release -DVCUBE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset windows-release
      - name: Test
        run: ctest --preset windows-release
      - name: Package
        working-directory: build/windows-release
        run: cpack
      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: v-cube-windows-x64
          path: build/windows-release/v-cube-*.zip
          if-no-files-found: error
